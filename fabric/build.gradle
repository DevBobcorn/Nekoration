plugins {
    // 1.13.6 matches the Loom version JEI 19.53.0.426 was built with; older Loom
    // refuses to consume mod jars produced by a newer Loom ("Mod was built with
    // a newer version of Loom").
    id 'fabric-loom' version '1.13.6'
}

base {
    archivesName = 'nekoration-fabric'
}

// Shared resource locations in the common module.
def commonGeneratedResources = project(':common').file('src/generated/resources')
def commonMainResources = project(':common').file('src/main/resources')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // REQUIRED — official mappings keep the common source tree compiling unchanged.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Annotations used by the common sources (on NeoForge's classpath out of the box).
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

loom {
    // Widens the same vanilla members the common module ATs (see common/build.gradle).
    accessWidenerPath = project(':common').file('src/main/resources/nekoration.accesswidener')
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

// The common module's resources (shared assets + datagen output) are packaged
// and placed on the dev-run classpath via this source set.
sourceSets.main.resources {
    srcDirs += commonGeneratedResources
    srcDirs += commonMainResources
    exclude '**/*.bbmodel'          // BlockBench project files
    exclude '.cache/**'             // datagen cache files
}

def modVersion = project.mod_version

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
    // JEI and other BlameJared-hosted mods.
    maven { url = "https://maven.blamejared.com/" }
    // Night Config and TypeResolver libraries.
    mavenCentral()
}

// JEI for runtime testing only: available in the dev game instance, but not
// a compile or published dependency (modLocalRuntime, not modImplementation).
// Biomes O' Plenty and its required libraries likewise, for world-gen testing.
dependencies {
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    // Jade for runtime testing (no compile-time use on Fabric; the Jade plugin is NeoForge-only).
    modLocalRuntime "maven.modrinth:jade:${jade_version}+fabric"

    modLocalRuntime "maven.modrinth:biomes-o-plenty:${biomes_o_plenty_modrinth_version_id_fabric}"
    modLocalRuntime "maven.modrinth:glitchcore:${glitchcore_modrinth_version_id_fabric}"
    modLocalRuntime "maven.modrinth:terrablender:${terrablender_modrinth_version_id_fabric}"

    // TerraBlender and GlitchCore bundle Night Config and TypeResolver as
    // jar-in-jar for production, but Loom does not extract nested jars from
    // external dependencies, so add them directly for the dev game instance
    // (same versions as the bundled JiJs; not packaged with the mod itself).
    runtimeOnly "com.electronwill.night-config:core:3.6.7"
    runtimeOnly "com.electronwill.night-config:toml:3.6.7"
    runtimeOnly "net.jodah:typetools:0.6.3"
}
