// Root build script: shared subproject configuration + the BOP-style source
// sharing mechanism. Each platform module recompiles the common sources
// against its own loader's Minecraft jar; common itself compiles against
// vanilla Minecraft only (ModDevGradle + NeoForm, official mappings).

subprojects {
    apply plugin: 'java-library'

    group = mod_group_id
    version = mod_version

    // Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }

    if (it.name != 'common') {
        // Keep the project dependency for the compiler and the Java language
        // server: the platform source sets must include common sources so VSCode
        // can resolve symbols while editing Fabric/NeoForge sources.
        dependencies {
            compileOnly project(':common')
        }

        sourceSets.main.java.srcDir project(':common').sourceSets.main.java

        // Recompile the common sources together with the platform sources.
        // (Only the main compile; test classes get common classes via the
        // project dependency and the platform module's own main output.)
        tasks.withType(JavaCompile).configureEach {
            if (it.name == 'compileJava') {
                source project(':common').sourceSets.main.allJava
            }
        }
    }
}
